# Check that the pattern stays compile-clean.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start font server
        run: npm start &

      - name: Wait for server
        run: sleep 2

      - name: Check font endpoint responds
        run: curl -sf -o /dev/null http://localhost:3000/fonts/myfont

      - name: Check CORS header is present and scoped
        run: |
          curl -sI http://localhost:3000/fonts/myfont \
            | grep -i "access-control-allow-origin" \
            | grep -q "http://localhost:5173"
